apiVersion: apps/v1
kind: Deployment
metadata:
  name: os
  labels:
    app.kubernetes.io/name: os
    app.kubernetes.io/part-of: oficina-fase4
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: os
  template:
    metadata:
      labels:
        app.kubernetes.io/name: os
        app.kubernetes.io/part-of: oficina-fase4
    spec:
      serviceAccountName: os
      # Migrations antes do container principal. O Prisma CLI está em dependencies
      # (presente na imagem de produção): --no-install usa o binário local, sem download.
      initContainers:
        - name: prisma-migrate
          image: os
          command: ['npx', '--no-install', 'prisma', 'migrate', 'deploy']
          envFrom:
            - secretRef:
                name: os-secret
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      containers:
        - name: os
          image: os
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: os-config
            - secretRef:
                name: os-secret
          # Endpoint público, sem auth e sem banco.
          readinessProbe:
            httpGet:
              path: /api/os/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/os/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
